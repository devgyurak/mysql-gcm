name: build
on: { pull_request: {}, push: { branches: [main], tags: ["v*"] } }
permissions: { contents: read, packages: write }
jobs:
  matrix:
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        mysql: ["8.0", "8.4", "9"]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build component (cached configured MySQL tree in GHCR)
        run: scripts/build-in-docker.sh "${{ matrix.mysql }}"
      - uses: actions/upload-artifact@v4
        with: { name: "component_gcm-mysql${{ matrix.mysql }}-${{ matrix.arch }}", path: "build/${{ matrix.mysql }}/component_gcm.so" }

