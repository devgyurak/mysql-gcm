name: integration
on: { pull_request: {}, push: { branches: [main, develop] } }
permissions: { contents: read, packages: read }
# A new push supersedes the run before it, so three superseded server-image pulls do not keep
# running. Only pull_request runs are cancelled — a push to main or develop must finish, because it
# is the gate on that branch.
#
# Deliberately *not* path-filtered: `smoke (8.0|8.4|9)` are required checks, and a filter would stop
# them reporting on an unrelated PR, which leaves the merge button blocked forever. The MTR job that
# used to live here is in mtr.yml, where it can be filtered because it is not required.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The component is built here rather than downloaded: actions/download-artifact@v4
  # only sees artifacts from its own workflow run, so pulling build.yml's output from
  # a separate workflow would fail and leave this gate vacuously green. The expensive
  # part — the configured MySQL source tree — is a cached image, so building the
  # component target again is cheap (ci-release skill).
  smoke:
    strategy: { fail-fast: false, matrix: { mysql: ["8.0", "8.4", "9"] } }
    runs-on: ubuntu-24.04
    env:
      GCM_REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/build-in-docker.sh "${{ matrix.mysql }}"
      - run: scripts/verify.sh "${{ matrix.mysql }}"
      - name: Collect diagnostics
        if: failure()
        run: |
          docker exec "mysql-dev-${{ matrix.mysql }}" mysql -uroot -e \
            'SELECT * FROM mysql.component' > "build/${{ matrix.mysql }}/components.txt" || true
          docker logs --tail 200 "mysql-dev-${{ matrix.mysql }}" \
            > "build/${{ matrix.mysql }}/server.log" 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: "integration-${{ matrix.mysql }}"
          path: |
            build/${{ matrix.mysql }}/tmp_disk.txt
            build/${{ matrix.mysql }}/*.actual
            build/${{ matrix.mysql }}/components.txt
            build/${{ matrix.mysql }}/server.log
