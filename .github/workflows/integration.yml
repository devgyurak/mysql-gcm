name: integration
on: { pull_request: {}, push: { branches: [main, develop] } }
permissions: { contents: read }
jobs:
  # The component is built here rather than downloaded: actions/download-artifact@v4
  # only sees artifacts from its own workflow run, so pulling build.yml's output from
  # a separate workflow would fail and leave this gate vacuously green. The expensive
  # part — the configured MySQL source tree — is a cached image, so building the
  # component target again is cheap (ci-release skill).
  smoke:
    strategy: { fail-fast: false, matrix: { mysql: ["8.0", "8.4", "9"] } }
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build-in-docker.sh "${{ matrix.mysql }}"
      - run: scripts/verify.sh "${{ matrix.mysql }}"
      - name: Collect diagnostics
        if: failure()
        run: |
          docker exec "mysql-dev-${{ matrix.mysql }}" mysql -uroot -e \
            'SELECT * FROM mysql.component' > "build/${{ matrix.mysql }}/components.txt" || true
          docker logs --tail 200 "mysql-dev-${{ matrix.mysql }}" \
            > "build/${{ matrix.mysql }}/server.log" 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "integration-${{ matrix.mysql }}"
          path: |
            build/${{ matrix.mysql }}/tmp_disk.txt
            build/${{ matrix.mysql }}/*.actual
            build/${{ matrix.mysql }}/components.txt
            build/${{ matrix.mysql }}/server.log

  # MTR needs a *built* mysqld, not just a configured tree, so scripts/mtr.sh compiles
  # the server inside the build container and keeps it there. That is expensive on a
  # cold runner: point GCM_MTR_CONTAINER at a cached container, or publish a
  # server-built image to GHCR the way the build job caches the configured tree
  # (ci-release skill). The .result files are committed, so this is a real gate.
  mtr:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build-in-docker.sh 8.4
      - run: scripts/mtr.sh 8.4
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: mtr-logs, path: "build/8.4/mtr/" }
