name: load
on:
  schedule: [{ cron: "0 18 * * *" }]   # 03:00 KST nightly
  workflow_dispatch:
    inputs:
      rows: { default: "300000" }
      # The nightly measures AES-256, the default and the recommendation. The other two
      # suites are measured on dispatch, against the same aes-256-cbc baseline, so their
      # ratios are comparable with the nightly's.
      suite:
        description: "GCM suite for the encrypted column"
        type: choice
        options: [aes256, aes192, aes128]
        default: aes256
      # The recipe study is dispatch-only and never part of the nightly gate: it measures
      # rows into the filter and plans, not a ratio, and its numbers land in docs/perf.md.
      recipes:
        description: "Recipe study: comma list of recipes (e.g. scope_page), or empty to skip"
        default: ""
      index:
        description: "Index shape for the recipe study"
        type: choice
        options: [none, scope_enc, covering, both]
        default: both
      depts:
        description: "Scope count for the recipe study (the index table uses 10)"
        default: "10"
      pad-bytes:
        description: "Width of the non-indexed padding column for the recipe study"
        default: "1024"
permissions: { contents: read }
jobs:
  load:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: scripts/build-in-docker.sh 8.4
      # verify.sh uninstalls the component when it finishes, so the load run has to
      # install it again before it can call the functions.
      - run: scripts/verify.sh 8.4
      - name: Install the component for the load run
        run: |
          set -euo pipefail
          dir=$(docker exec mysql-dev-8.4 mysql -uroot -N -e 'SELECT @@plugin_dir')
          docker cp build/8.4/component_gcm.so "mysql-dev-8.4:${dir}component_gcm.so"
          docker exec mysql-dev-8.4 mysql -uroot -e "INSTALL COMPONENT 'file://component_gcm'"
          echo "MYSQL_PORT=$(docker port mysql-dev-8.4 3306/tcp | head -1 | cut -d: -f2)" >> "$GITHUB_ENV"
      - run: pip install PyMySQL && python tests/load/run.py --rows "${{ inputs.rows || '300000' }}" --suite "${{ inputs.suite || 'aes256' }}" --concurrency 1,8,32 --baseline aes --gate tests/load/baseline.json --out load-result.json
        env: { MYSQL_HOST: "127.0.0.1" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: "load-result-${{ inputs.suite || 'aes256' }}", path: load-result.json }
      # After the gate: the recipe study leaves its own 300k-row table behind, and the gate's
      # 1.0 s absolute check should not be measured over it. always() so a failed gate still
      # uploads the study.
      - name: Recipe study (dispatch only)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.recipes != '' }}
        run: |
          set -euo pipefail
          pip install PyMySQL
          python tests/load/recipes.py --rows "${{ inputs.rows || '300000' }}" \
            --depts "${{ inputs.depts }}" --pad-bytes "${{ inputs.pad-bytes }}" \
            --index "${{ inputs.index }}" --recipes "${{ inputs.recipes }}" \
            --out recipes-result.json
        env: { MYSQL_HOST: "127.0.0.1" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.recipes != '' }}
        with: { name: "recipes-result", path: recipes-result.json }
