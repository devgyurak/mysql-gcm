name: mtr
# The MySQL test harness, split out of integration.yml so it can be path-filtered.
#
# It is the only gate that runs the component inside the server's own test framework, and that
# framework checks things verify.sh cannot: an unexpected line in the error log fails the test, which
# is why gcm_replication.test has to call mtr.add_suppression for the SBR warning. A crash during
# shutdown, or a component that pollutes the log, shows up here and nowhere else. For a change under
# src/ that signal is worth the hour it costs.
#
# For a change that cannot affect it, that hour buys nothing: measured runs take 49 to 63 minutes, and
# a documentation-only pull request was spending one of them. Hence the paths filter — a PR touching
# none of them cannot change the outcome, so not running is the correct result rather than a gap.
#
# It cannot live in integration.yml with a filter, because `smoke (8.0|8.4|9)` in that workflow are
# required checks: a path filter there would stop them reporting on an unrelated PR and a required
# check that never reports blocks the merge button forever. `mtr` itself is deliberately not required
# for the same reason it is not cheap.
#
# The expensive part is that MTR needs a *built* mysqld, not the configured tree build.yml caches.
# images.yml publishes one (mysql-gcm-mtr, 8.4 only) and scripts/mtr.sh pulls it when GCM_REGISTRY is
# set, so a run that finds the image is a pull plus a component build. A run that does not -- the tag
# is new because docker/** changed, or images.yml has not run since -- compiles the server here, and
# that is the hour. The compiled tree measures 3.1 GB on 8.4.11, so the image is about 6 GB with its
# base; it was estimated at 10-20 GB before it was measured. Point GCM_MTR_CONTAINER at a warm
# container locally.
on:
  pull_request:
    paths: &mtr_paths
      - "src/**"
      - "mysql-test/**"
      - "spec/**"
      - "docker/**"
      - "scripts/mtr.sh"
      - "scripts/build-in-docker.sh"
      - ".github/workflows/mtr.yml"
  push:
    branches: [main, develop]
    paths: *mtr_paths
permissions: { contents: read, packages: read }
# A new push supersedes the run before it. Without this, every push to a PR started another
# hour-long server build while the superseded ones kept going — four pushes meant four concurrent
# builds competing for runners. A push to main or develop is never cancelled: it is the gate on that
# branch, not a preview of it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  mtr:
    runs-on: ubuntu-24.04
    # Still generous: a published mtr image makes this a pull plus a component build,
    # but a PR that changes docker/** has no image to pull and compiles the server.
    timeout-minutes: 180
    env:
      # images.yml publishes these; a miss falls back to building locally, so this is
      # a cache and never a dependency.
      GCM_REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # scripts/build-in-docker.sh is deliberately not run first. It produced a .so this
      # job never used -- mtr.sh copies src/ into the MTR container and builds the
      # component there -- and with the images published it would mean pulling the 2.6 GB
      # configured-tree image on top of the one that already contains a compiled server.
      #
      # 8.4 only: the .result files are recorded against it (scripts/mtr.sh says so), and
      # recording them per major would mean three of these.
      #
      # GCM_MTR_JOBS defaults to 3 for a laptop's docker memory. A hosted runner has
      # 4 cores and 16 GB, and the default left one core idle for the whole fallback
      # build; it makes no difference once the image is pulled.
      - run: GCM_MTR_JOBS="$(nproc)" scripts/mtr.sh 8.4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: mtr-logs, path: "build/8.4/mtr/" }
