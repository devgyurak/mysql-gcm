# End-to-end: a primary with ROW binlog, a replica, and a runner that only speaks
# SQL. The component .so comes from the build artifact, mounted read-only into each
# server's plugin directory — the same official images the integration smoke uses,
# never a custom server image (stack-ci-docker rule).
#
#   docker compose -f tests/e2e/compose.yml up --build --exit-code-from runner \
#     --abort-on-container-exit
#
# Defaults run MySQL 8.4. To exercise another major, point both at that build — the
# digests are the ones in docker/versions.json, e.g. for 9.x:
#
#   GCM_SO=../../build/9/component_gcm.so \
#   GCM_SERVER_IMAGE=mysql:9.4@sha256:135bc87cce147c3d28cecb9ad270b814cb52805af7ddeea83bfcaf157d05a6b2 \
#   docker compose -f tests/e2e/compose.yml up --build --exit-code-from runner
#
# The runner picks the gcm.strict scenario from the server version it finds, so no
# other change is needed (docs/design.md amendment A5).
name: mysql-gcm-e2e

x-server: &server
  image: ${GCM_SERVER_IMAGE:-mysql:8.4@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d}
  environment:
    MYSQL_ALLOW_EMPTY_PASSWORD: "1"
  healthcheck:
    # Over TCP, not the socket: during a fresh initialisation the official image runs a
    # temporary server that listens on the socket only (`port: 0`), and a socket ping
    # would report healthy while that server is about to be stopped and replaced.
    test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3306", "-uroot", "--silent"]
    interval: 2s
    timeout: 5s
    retries: 30
    # A TCP probe answers nothing until initialisation finishes, so unlike the socket ping
    # it spends the retry budget. start_period keeps those failures from counting: compose
    # aborts the whole run the moment a dependency goes unhealthy and does not wait for it
    # to recover, and four servers initialising at once on a shared runner should not have
    # to fit inside 30 x 2s. Measured at 9s for three from cold on a developer machine.
    start_period: 90s
  volumes:
    - ${GCM_SO:-../../build/8.4/component_gcm.so}:/usr/lib64/mysql/plugin/component_gcm.so:ro

services:
  primary:
    <<: *server
    command: >-
      --server-id=1
      --log-bin=primary-bin
      --binlog-format=ROW
      --enforce-gtid-consistency=ON
      --gtid-mode=ON
      --loose_gcm.strict=ON
      --general_log=OFF

  replica:
    <<: *server
    command: >-
      --server-id=2
      --log-bin=replica-bin
      --binlog-format=ROW
      --enforce-gtid-consistency=ON
      --gtid-mode=ON
      --loose_gcm.strict=ON
      --general_log=OFF
      --read-only=ON

  # An independent server, not a replica: it stands in for a second shard. Sharding
  # correctness for this component is about two servers agreeing on deterministic
  # bytes for the same (key, plaintext, AAD), which needs a server that shares no
  # binlog with the first (docs/design.md amendment A8).
  shard_b:
    <<: *server
    command: >-
      --server-id=3
      --loose_gcm.strict=ON
      --general_log=OFF

  runner:
    build:
      context: .
    environment:
      PRIMARY_HOST: primary
      REPLICA_HOST: replica
      SHARD_B_HOST: shard_b
      MYSQL_USER: root
      # Throwaway credential for the replication user on this compose network only.
      # Kept out of the Python source (stack-python rule) and never reused elsewhere.
      REPL_PASSWORD: ${GCM_E2E_REPL_PASSWORD:-e2e-replication-throwaway}
    depends_on:
      primary:
        condition: service_healthy
      replica:
        condition: service_healthy
      shard_b:
        condition: service_healthy
